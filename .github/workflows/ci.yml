name: Backend CI

on:
  push:
  pull_request:

jobs:
  lint:
    name: Black
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libpq-dev \
            postgresql-client

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check formatting
        run: black --check .


  test:
    name: Tests
    runs-on: ubuntu-latest

    needs: lint

    services:
      postgres:
        image: postgres:15

        env:
          POSTGRES_DB: zoony_test
          POSTGRES_USER: zoony_test
          POSTGRES_PASSWORD: ci_test_password

        ports:
          - 5432:5432

        options: >-
          --health-cmd="pg_isready -U zoony_test -d zoony_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      # Never use production Supabase in CI
      DATABASE_URL: ""

      DB_NAME: zoony_test
      DB_USER: zoony_test
      DB_PASSWORD: ci_test_password
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_SSL_MODE: disable

      DJANGO_SECRET_KEY: ci-only-secret-key-not-for-production
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libpq-dev \
            postgresql-client

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django system check
        run: python manage.py check

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Apply migrations
        run: python manage.py migrate --noinput

      - name: Run tests
        run: pytest
