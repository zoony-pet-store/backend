stages:
  - lint
  - test

black:
  stage: lint
  image: python:3.11
  before_script:
    - pip install -r requirements.txt
  script:
    - black --check .
  allow_failure: false

test:
  stage: test
  image: python:3.11
  before_script:
    - pip install -r requirements.txt
  script:
    - pytest
