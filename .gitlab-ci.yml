stages:
  - lint
  - test
  - deploy

variables:
  AWS_DEFAULT_REGION: "eu-central-1"
  EB_APPLICATION: "catdog-backend"
  EB_ENVIRONMENT: "catdog-backend-env"
  S3_BUCKET: "catdog-backend-bucket"

image: python:3.12-slim

cache:
  key: "${CI_COMMIT_REF_SLUG}"
  paths:
    - .cache/pip
    - .venv/

before_script:
  - python -m venv .venv
  - source .venv/bin/activate

lint:
  stage: lint
  before_script:
    - apt-get update && apt-get install -y build-essential libpq-dev
    - pip install -r requirements.txt
  script:
    - black --check .

test:
  stage: test
  before_script:
    - apt-get update && apt-get install -y build-essential libpq-dev
    - pip install -r requirements.txt
  script:
    - pytest

deploy:
  stage: deploy
  before_script:
    - pip install awsebcli
  script:
    - eb deploy
  only:
    - develop
